defaultGroups:
- name: users
  must_exist: true
  system: true
- lp
- video
- network
- storage
- name: wheel
  must_exist: false
  system: true
- audio
- name: nopasswdlogin
  must_exist: false
  system: true
- name: autologin
  must_exist: false
  system: true
sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
  minLength: 8
  maxLength: 64
  libpwquality:
  - minlen=8
  - maxrepeat=3
  - maxsequence=3
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names:
  - root
  home_permissions: o700
  nopasswd_group: nopasswdlogin
hostname:
  location: EtcFile
  writeHostsFile: true
  template: flowos-${cpu}
  forbidden_names:
  - localhost
allowActiveDirectory: false
presets:
  fullName:
    editable: true
  loginName:
    editable: true
